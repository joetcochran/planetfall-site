<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico" sizes="any"><title>Planetfall</title><link rel="stylesheet" href="game.css"><script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script></head><body>
<section id="view" aria-label="Room view: drag to look around, click things to interact">
  <div id="hud"><span id="hover" role="status"></span><span>Drag to look · click to interact · <a href="map.html" style="color:#79bdce;pointer-events:auto">world map</a> · <a href="wiki.html" style="color:#79bdce;pointer-events:auto">how it was made</a> · <button id="restart-hud" style="pointer-events:auto;font:inherit;background:none;border:0;color:#79bdce;cursor:pointer;padding:0">restart</button> · <button id="toggle-debug" style="pointer-events:auto;font:inherit;background:none;border:0;color:#79bdce;cursor:pointer;padding:0">debug</button></span></div>
  <div id="debug"><label>Jump to room <select id="jump"><option value="">choose…</option></select></label> <label>Start from checkpoint <select id="checkpoint"><option value="">choose…</option></select></label> <button id="restart">Restart game</button><pre id="flags"></pre></div>
  <div id="compass" aria-label="Exits"></div>
  <div id="quick"><button id="look">Look</button><button id="inv">Inventory</button><button id="wait">Wait</button><button id="leave" hidden></button><button id="diagnose">Diagnose</button><button id="takeall" hidden>Take all</button><button id="dropall" hidden>Drop all</button><button id="sleep" hidden>Sleep</button><button id="waitfor" hidden></button><button id="save">Save</button><button id="restore" hidden>Restore</button></div>
  <div id="toast" role="status" hidden></div>
  <div id="death" hidden><div><h2 id="death-title">You have died</h2><p id="death-text" hidden></p><button id="restore2" hidden>Restore your saved game</button> <button id="restart2">Start again</button></div></div>
</section>
<aside>
  <div id="status" role="status"></div>
  <div id="transcript" aria-live="polite"></div>
  <div id="inventory"></div>
</aside>
<div id="command-row"><input id="command" placeholder="Type a command (e.g. look, take brush, open pod door, west)" autocomplete="off" aria-label="Command"></div>
<div id="menu" hidden></div>
<script type="module">import('./game.js').catch(e=>{document.querySelector('#transcript').textContent='Unable to start: '+e.message;console.error(e);});</script></body></html>
